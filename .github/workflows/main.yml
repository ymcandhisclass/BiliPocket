name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          sudo apt-get update -y

          # 安装系统依赖与 Qt 开发包（用于本机构建 x86_64）
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            lld \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5 \
            libqt5multimedia5 \
            libqt5multimedia5-plugins \
            libqt5multimediawidgets5

          # 安装 Go（项目需要）
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version

      - name: Install xmake
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already installed: $(xmake --version)"
            echo "$(dirname $(command -v xmake))" >> $GITHUB_PATH
          else
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://xmake.io/shget.text | bash -s --
            else
              wget -qO- https://xmake.io/shget.text | bash -s --
            fi
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Fix Qt linking (create unversioned .so symlinks if needed)
        run: |
          set -e
          TARGET_DIR=/usr/lib/x86_64-linux-gnu
          echo "Checking for unversioned libQt5Multimedia.so in $TARGET_DIR..."
          if [ -f "$TARGET_DIR/libQt5Multimedia.so" ]; then
            echo "libQt5Multimedia.so already present"
            exit 0
          fi

          # Try to find a versioned libQt5Multimedia file
          CAND=$(find "$TARGET_DIR" /usr/lib -type f -name 'libQt5Multimedia.so.*' | head -n 1 || true)
          if [ -n "$CAND" ]; then
            echo "Found versioned Qt multimedia lib: $CAND"
            sudo ln -sf "$CAND" "$TARGET_DIR/libQt5Multimedia.so"
            sudo ldconfig
            echo "Created symlink: $TARGET_DIR/libQt5Multimedia.so -> $CAND"
            exit 0
          fi

          # 如果没在常见目录找到，尝试更广泛搜索并打印调试信息
          echo "未在 $TARGET_DIR 或 /usr/lib 中找到 libQt5Multimedia 的版本化库。列出这两个目录前 200 项供排查："
          ls -la "$TARGET_DIR" | sed -n '1,200p' || true
          ls -la /usr/lib | sed -n '1,200p' || true
          echo "如果你需要交叉构建 aarch64，请确保提供包含 libQt5Multimedia.so 的 aarch64 Qt SDK，并在 workflow 中下载并解压。"
          exit 1

      - name: Build Plugin with xmake (native x86_64 using clang)
        env:
          CC: clang
          CXX: clang++
          LD: ld.lld
          PATH: ${{ env.PATH }}:/usr/local/go/bin:$HOME/.local/bin
        run: |
          echo "using CC=$(command -v $CC || true), CXX=$(command -v $CXX || true), LD=$(command -v $LD || true)"
          xmake --version || true

          # 本机构建（clang）
          xmake f -c -m release -vD
          xmake -vD

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
