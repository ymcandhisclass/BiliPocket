name: Build BiliPocket Plugin

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up build environment
        run: |
          sudo apt-get update -y

          # 安装系统依赖与 Qt 开发包（用于本机构建 x86_64）
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            lld \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5 \
            libqt5multimedia5 \
            libqt5multimedia5-plugins \
            libqt5multimediawidgets5 \
            qtmultimedia5-dev

          # 安装 aarch64 交叉编译工具链
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          # 安装 Go（项目需要）
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version

      - name: Install xmake
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already installed: $(xmake --version)"
            echo "$(dirname $(command -v xmake))" >> $GITHUB_PATH
          else
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://xmake.io/shget.text | bash -s --
            else
              wget -qO- https://xmake.io/shget.text | bash -s --
            fi
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Fix Qt linking (create unversioned .so symlinks if needed)
        run: |
          set -e
          TARGET_DIR=/usr/lib/x86_64-linux-gnu
          echo "Checking for unversioned libQt5Multimedia.so in $TARGET_DIR..."
          if [ -f "$TARGET_DIR/libQt5Multimedia.so" ]; then
            echo "libQt5Multimedia.so already present"
            exit 0
          fi

          CAND=$(find "$TARGET_DIR" /usr/lib -type f -name 'libQt5Multimedia.so.*' | head -n 1 || true)
          if [ -n "$CAND" ]; then
            echo "Found versioned Qt multimedia lib: $CAND"
            sudo ln -sf "$CAND" "$TARGET_DIR/libQt5Multimedia.so"
            sudo ldconfig
            echo "Created symlink: $TARGET_DIR/libQt5Multimedia.so -> $CAND"
            exit 0
          fi

          echo "未在 $TARGET_DIR 或 /usr/lib 中找到 libQt5Multimedia 的版本化库。"
          exit 1

      - name: Build Plugin x86_64 (验证编译)
        env:
          CC: clang
          CXX: clang++
          LD: ld.lld
          PATH: ${{ env.PATH }}:/usr/local/go/bin:$HOME/.local/bin
        run: |
          echo "=== x86_64 验证构建 ==="
          xmake f -c -m release -p linux -a x86_64 -vD
          xmake -vD
          echo "x86_64 构建完成"

      - name: Build Plugin aarch64 (交叉编译)
        env:
          PATH: ${{ env.PATH }}:/usr/local/go/bin:$HOME/.local/bin
        run: |
          echo "=== aarch64 交叉编译 ==="
          
          # 获取 Qt5 头文件路径（架构无关，x86_64 的头文件可用于 aarch64 编译）
          QT_INC=$(pkg-config --cflags-only-I qt5 2>/dev/null | sed 's/-I//g' | head -1)
          if [ -z "$QT_INC" ]; then
            QT_INC="/usr/include/x86_64-linux-gnu/qt5"
          fi
          echo "Qt include path: $QT_INC"
          
          # 创建输出目录
          mkdir -p build/linux/arm64-v8a/release
          
          # 收集所有源文件
          find src -name '*.cpp' > /tmp/srcs.txt
          echo "Source files:"
          cat /tmp/srcs.txt
          
          # 用 aarch64 交叉编译器编译
          # 注意：不链接 Qt 库，运行时由 DictPen 进程提供符号
          aarch64-linux-gnu-g++ -std=c++17 -shared -fPIC -O2 \
            -I src \
            -I "$QT_INC" \
            -I "$QT_INC/QtCore" \
            -I "$QT_INC/QtQuick" \
            -I "$QT_INC/QtQml" \
            -I "$QT_INC/QtNetwork" \
            -I "$QT_INC/QtMultimedia" \
            -I "$QT_INC/QtGui" \
            -DQT_NO_KEYWORDS \
            $(cat /tmp/srcs.txt) \
            -o build/linux/arm64-v8a/release/libbili_plugin.so \
            -Wl,--no-undefined \
            -Wl,-rpath,'$$ORIGIN' \
            2>&1
          
          echo "=== 验证 aarch64 输出 ==="
          file build/linux/arm64-v8a/release/libbili_plugin.so
          readelf -h build/linux/arm64-v8a/release/libbili_plugin.so | grep -E 'Machine|Class'
          echo "aarch64 构建完成"

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh
          
          echo "=== 打包内容验证 ==="
          unzip -l bili_plugin.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
