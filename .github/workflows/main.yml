name: Build BiliPocket Plugin

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang lld cmake git pkg-config wget zip \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick2 \
            qtquickcontrols2-5-dev libqt5quickwidgets5 \
            libqt5multimedia5 libqt5multimedia5-plugins \
            libqt5multimediawidgets5 qtmultimedia5-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s --
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix Qt linking
        run: |
          set -e
          TARGET_DIR=/usr/lib/x86_64-linux-gnu
          CAND=$(find "$TARGET_DIR" /usr/lib -type f -name 'libQt5Multimedia.so.*' | head -n 1 || true)
          if [ -n "$CAND" ]; then
            sudo ln -sf "$CAND" "$TARGET_DIR/libQt5Multimedia.so"
            sudo ldconfig
            echo "Created symlink"
          fi

      - name: Build Plugin x86_64 (验证编译)
        env:
          CC: clang
          CXX: clang++
          LD: ld.lld
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== x86_64 构建 ==="
          xmake f -c -m release -p linux -a x86_64 -vD
          xmake -vD
          echo "x86_64 构建完成"
          file build/linux/x86_64/release/libbili_plugin.so

      - name: Build Plugin aarch64 (交叉编译)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== aarch64 交叉编译 ==="

          QT_INC=$(pkg-config --cflags-only-I qt5 2>/dev/null | sed 's/-I//g' | head -1 || true)
          if [ -z "$QT_INC" ]; then
            QT_INC="/usr/include/x86_64-linux-gnu/qt5"
          fi
          echo "Qt include path: $QT_INC"

          mkdir -p build/linux/arm64-v8a/release

          find src -name '*.cpp' > /tmp/srcs.txt

          aarch64-linux-gnu-g++ -std=c++17 -shared -fPIC -O2 \
            -I src \
            -I "$QT_INC" \
            -I "$QT_INC/QtCore" \
            -I "$QT_INC/QtQuick" \
            -I "$QT_INC/QtQml" \
            -I "$QT_INC/QtNetwork" \
            -I "$QT_INC/QtMultimedia" \
            -I "$QT_INC/QtGui" \
            -DQT_NO_KEYWORDS \
            $(cat /tmp/srcs.txt) \
            -o build/linux/arm64-v8a/release/libbili_plugin.so \
            -Wl,--no-undefined \
            -Wl,-rpath,'$$ORIGIN'

          echo "=== 验证 aarch64 输出 ==="
          file build/linux/arm64-v8a/release/libbili_plugin.so
          readelf -h build/linux/arm64-v8a/release/libbili_plugin.so | grep -E 'Machine|Class'
          echo "aarch64 构建完成"

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh
          echo "=== 打包内容验证 ==="
          unzip -l bili_plugin.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30
