name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          # 更新包管理器
          sudo apt-get update -y

          # 安装系统依赖与 Qt 开发包（注意：不要在续行中放注释）
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

          # 安装 Go 1.21
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo "PATH=/usr/local/go/bin:$PATH" >> $GITHUB_PATH
          go version

      - name: Install Zig (for zigcc toolchain)
        run: |
          # 尝试通过 apt 安装 zig（若可用）
          if sudo apt-get install -y zig; then
            echo "zig installed via apt"
          else
            echo "apt install zig failed or not available, attempting official download"
            ZIG_VER="0.11.0"
            ZIG_TAR="zig-linux-x86_64-${ZIG_VER}.tar.xz"
            ZIG_URL="https://ziglang.org/download/${ZIG_VER}/${ZIG_TAR}"
            wget -q "$ZIG_URL" -O /tmp/$ZIG_TAR || { echo "zig download failed"; exit 1; }
            sudo mkdir -p /opt/zig
            sudo tar -xJf /tmp/$ZIG_TAR -C /opt/zig
            sudo ln -sfn /opt/zig/zig-linux-x86_64-${ZIG_VER} /opt/zig/current
            sudo ln -sfn /opt/zig/current/zig /usr/local/bin/zig
            echo "zig installed to /opt/zig/current"
          fi

          # 校验 zig 可用性
          if command -v zig >/dev/null 2>&1; then
            echo "zig version: $(zig version)"
          else
            echo "zig not found after install attempts" >&2
            exit 1
          fi

      - name: Install xmake
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already installed: $(xmake --version)"
            # 把当前 xmake 路径加入 GITHUB_PATH（如果需要）
            echo "PATH=$(dirname $(which xmake)):$PATH" >> $GITHUB_PATH
          else
            # 使用官方安装脚本安装 xmake（不要把 -y 当作版本参数）
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://xmake.io/shget.text | bash -s --
            else
              wget -qO- https://xmake.io/shget.text | bash -s --
            fi
            # 安装脚本默认放到 $HOME/.local/bin
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Setup Qt cross-compilation
        run: |
          # 尝试下载并解压交叉 Qt（若不可用则使用系统 Qt /usr）
          mkdir -p $HOME/qt-aarch64
          QT_TARBALL="$HOME/qt-aarch64/qt.tar.gz"
          wget -q https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/download/v5.15.2/qt-aarch64-linux-5.15.2.tar.gz -O "$QT_TARBALL" || echo "Qt tarball 下载失败，使用系统 Qt (/usr)"
          if [ -f "$QT_TARBALL" ]; then
            tar -xzf "$QT_TARBALL" -C $HOME/qt-aarch64 || echo "Qt 解压失败，使用系统 Qt (/usr)"
            # 根据实际解压结构调整下行路径
            QT_CANDIDATE="$HOME/qt-aarch64/Qt-5.15.2-aarch64"
            if [ -d "$QT_CANDIDATE" ]; then
              echo "交叉 Qt 解压并使用：$QT_CANDIDATE"
              echo "QT_ROOT=$QT_CANDIDATE" >> $GITHUB_ENV
            else
              echo "未在预期路径找到交叉 Qt，改用系统 Qt (/usr)"
              echo "QT_ROOT=/usr" >> $GITHUB_ENV
            fi
          else
            echo "QT_ROOT=/usr" >> $GITHUB_ENV
          fi

          # 打印 include 以便排查
          if [ -d "${QT_ROOT:-/usr}/include" ]; then ls -la "${QT_ROOT:-/usr}/include" | sed -n '1,200p'; else echo "警告：${QT_ROOT:-/usr}/include 不存在"; fi

      - name: Build Plugin with xmake
        env:
          # 确保 PATH 包含 go 与 zig（GITHUB_PATH 已追加，但在 step 中也可显式设置）
          PATH: ${{ env.PATH }}:/usr/local/bin:/usr/local/go/bin:/opt/zig/current:$HOME/.local/bin
        run: |
          echo "which zig: $(which zig || true)"
          echo "zig version: $(zig version || true)"
          echo "which xmake: $(which xmake || true)"
          xmake --version || true

          # 从 GITHUB_ENV 读取 QT_ROOT
          QT_ROOT=${QT_ROOT:-/usr}
          echo "使用 QT_ROOT=$QT_ROOT"

          # 配置并构建（-vD 打印详细信息）
          xmake f -c \
            --qt="$QT_ROOT" \
            --arch=arm64-v8a \
            --toolchain=zigcc \
            --cross=aarch64-linux-gnu.2.27 \
            -m release -vD

          xmake -vD

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
