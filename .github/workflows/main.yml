name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          # 更新包管理器并安装通用依赖
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            # 安装 Qt 开发包以提供头文件（用于本机构建 / 调试）
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5

          # 安装 Go 1.21
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          go version

      - name: Install xmake
        run: |
          # 安装 xmake v3.0.9
          wget https://github.com/xmake-io/xmake/releases/download/v3.0.9/xmake-v3.0.9.ubuntu.x86_64.AppImage
          chmod +x xmake-v3.0.9.ubuntu.x86_64.AppImage
          sudo mv xmake-v3.0.9.ubuntu.x86_64.AppImage /usr/local/bin/xmake
          xmake --version

      - name: Setup Qt cross-compilation
        run: |
          # 如果需要交叉编译（aarch64），下载并解压交叉 Qt 到 $HOME/qt-aarch64
          mkdir -p $HOME/qt-aarch64
          wget -q https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/download/v5.15.2/qt-aarch64-linux-5.15.2.tar.gz -O qt.tar.gz || echo "Qt 下载失败，后续将尝试使用系统 Qt (/usr)"
          if [ -f qt.tar.gz ]; then
            tar -xzf qt.tar.gz -C $HOME/qt-aarch64 || echo "Qt 解压失败，后续将尝试使用系统 Qt (/usr)"
            # 请根据解压结果调整 QT_ROOT，如果解压后目录名不同请修改
            export QT_ROOT="$HOME/qt-aarch64/Qt-5.15.2-aarch64"
            if [ -d "$QT_ROOT" ]; then
              echo "使用交叉 Qt：$QT_ROOT"
            else
              echo "未在预期路径找到解压后的 Qt，改为使用系统 Qt (/usr)"
              export QT_ROOT="/usr"
            fi
          else
            export QT_ROOT="/usr"
          fi

          # 输出 include 列表以便排查
          if [ -d "$QT_ROOT/include" ]; then ls -la "$QT_ROOT/include" | sed -n '1,200p'; else echo "警告：$QT_ROOT/include 不存在"; fi

      - name: Build Plugin with xmake
        run: |
          export PATH=$PATH:/usr/local/go/bin
          # 确保 QT_ROOT 有值，若上一步未设置则默认使用 /usr
          export QT_ROOT=${QT_ROOT:-/usr}

          echo "xmake using QT_ROOT=$QT_ROOT"

          # 在 xmake 配置中明确传入 --qt，指向已解压或系统 Qt 路径
          xmake f -c \
            --qt="$QT_ROOT" \
            --arch=arm64-v8a \
            --toolchain=zigcc \
            --cross=aarch64-linux-gnu.2.27 \
            -m release -vD

          # 发起构建并开启详细输出，便于检查实际传入的 -I 路径
          xmake -vD

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
