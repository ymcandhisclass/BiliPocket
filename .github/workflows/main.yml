name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          sudo apt-get update -y

          # 安装系统依赖与 Qt 开发包（注释不要放在续行中间）
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5 \
            # 交叉编译备用交叉工具链（可选）
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

          # 安装 Go 1.21
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          go version

      - name: Install Zig (for zigcc toolchain)
        run: |
          # 尝试通过 apt 安装 zig（最快）
          if sudo apt-get install -y zig; then
            echo "zig installed via apt"
          else
            echo "apt install zig failed or not available, attempting official download"
            ZIG_VER="0.11.0"
            ZIG_TAR="zig-linux-x86_64-${ZIG_VER}.tar.xz"
            ZIG_URL="https://ziglang.org/download/${ZIG_VER}/${ZIG_TAR}"
            wget -q "$ZIG_URL" -O /tmp/$ZIG_TAR || { echo "zig download failed"; exit 1; }
            sudo mkdir -p /opt/zig
            sudo tar -xJf /tmp/$ZIG_TAR -C /opt/zig
            # create symlink to current
            sudo ln -sfn /opt/zig/zig-linux-x86_64-${ZIG_VER} /opt/zig/current
            sudo ln -sfn /opt/zig/current/zig /usr/local/bin/zig
            echo "zig installed to /opt/zig/current"
          fi

          # verify
          if command -v zig >/dev/null 2>&1; then
            echo "zig version: $(zig version)"
          else
            echo "zig not found after install attempts" >&2
            exit 1
          fi

      - name: Install xmake
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already installed:"
            xmake --version
          else
            # 使用官方脚本安装 xmake（不要把 -y 当作版本）
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://xmake.io/shget.text | bash -s --
            else
              wget -qO- https://xmake.io/shget.text | bash -s --
            fi
            export PATH="$HOME/.local/bin:$PATH"
            if command -v xmake >/dev/null 2>&1; then
              xmake --version
            else
              echo "xmake 安装失败" >&2
              exit 1
            fi
          fi

      - name: Setup Qt cross-compilation
        run: |
          mkdir -p $HOME/qt-aarch64
          wget -q https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/download/v5.15.2/qt-aarch64-linux-5.15.2.tar.gz -O qt.tar.gz || echo "Qt 下载失败，后续将尝试使用系统 Qt (/usr)"
          if [ -f qt.tar.gz ]; then
            tar -xzf qt.tar.gz -C $HOME/qt-aarch64 || echo "Qt 解压失败，后续将尝试使用系统 Qt (/usr)"
            export QT_ROOT="$HOME/qt-aarch64/Qt-5.15.2-aarch64"
            if [ -d "$QT_ROOT" ]; then
              echo "使用交叉 Qt：$QT_ROOT"
            else
              echo "未在预期路径找到解压后的 Qt，改为使用系统 Qt (/usr)"
              export QT_ROOT="/usr"
            fi
          else
            export QT_ROOT="/usr"
          fi
          if [ -d "$QT_ROOT/include" ]; then ls -la "$QT_ROOT/include" | sed -n '1,200p'; else echo "警告：$QT_ROOT/include 不存在"; fi

      - name: Build Plugin with xmake
        env:
          PATH: ${{ env.PATH }}:/usr/local/go/bin:/opt/zig/current
        run: |
          # 确保 zig 与 xmake 在 PATH 中
          echo "which zig: $(which zig || true)"
          echo "zig version: $(zig version || true)"
          echo "which xmake: $(which xmake || true)"
          xmake --version || true

          export QT_ROOT=${QT_ROOT:-/usr}
          echo "xmake using QT_ROOT=$QT_ROOT"

          # 指定 --qt，使用 zigcc 工具链进行交叉构建（xmake 会查找 zig）
          xmake f -c \
            --qt="$QT_ROOT" \
            --arch=arm64-v8a \
            --toolchain=zigcc \
            --cross=aarch64-linux-gnu.2.27 \
            -m release -vD

          # 构建并输出详细日志（便于检查 -I）
          xmake -vD

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
