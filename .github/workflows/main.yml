name: Build BiliPocket Plugin

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang pkg-config wget zip file \
            qtbase5-dev qtdeclarative5-dev qml-module-qtquick2 \
            qtquickcontrols2-5-dev libqt5quickwidgets5 \
            libqt5multimedia5 libqt5multimedia5-plugins \
            libqt5multimediawidgets5 qtmultimedia5-dev

          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz

      - name: Install Zig
        run: |
          ZIG_VERSION=0.13.0
          wget -q https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz
          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz
          sudo mv zig-linux-x86_64-${ZIG_VERSION} /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s --
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix Qt linking
        run: |
          set -e
          TARGET_DIR=/usr/lib/x86_64-linux-gnu
          CAND=$(find "$TARGET_DIR" /usr/lib -type f -name 'libQt5Multimedia.so.*' | head -n 1 || true)
          if [ -n "$CAND" ]; then
            sudo ln -sf "$CAND" "$TARGET_DIR/libQt5Multimedia.so"
            sudo ldconfig
            echo "Created symlink libQt5Multimedia.so"
          fi

      - name: Build Plugin x86_64 (验证编译)
        env:
          CC: clang
          CXX: clang++
          LD: ld.lld
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== x86_64 构建 ==="
          xmake f -c -m release -p linux -a x86_64 -vD
          xmake -vD
          echo "x86_64 构建完成"
          file build/linux/x86_64/release/libbili_plugin.so

      - name: Build Plugin aarch64 (交叉编译, Zig + glibc 2.27)
        run: |
          echo "=== aarch64 交叉编译 (Zig, glibc 2.27) ==="

          QT_INC=/usr/include/x86_64-linux-gnu/qt5
          echo "Qt include path: $QT_INC"

          mkdir -p build/linux/arm64-v8a/release

          find src -name '*.cpp' > /tmp/srcs.txt

          # 关键：不 -DQT_NO_KEYWORDS（代码依赖 signals/slots/emit），
          # 不链接 Qt（宿主 DictPen 进程已加载 Qt，符号运行时解析），
          # 用 Zig 指定 glibc 2.27（设备 glibc=2.27，Ubuntu 工具链会引入 GLIBC_2.32 符号导致 dlopen 失败）
          zig c++ -target aarch64-linux-gnu.2.27 \
            -std=c++17 -shared -fPIC -O2 -s \
            -I src \
            -I "$QT_INC" \
            -I "$QT_INC/QtCore" \
            -I "$QT_INC/QtQuick" \
            -I "$QT_INC/QtQml" \
            -I "$QT_INC/QtNetwork" \
            -I "$QT_INC/QtMultimedia" \
            -I "$QT_INC/QtGui" \
            $(cat /tmp/srcs.txt) \
            -o build/linux/arm64-v8a/release/libbili_plugin.so

          echo "=== 验证 aarch64 输出 ==="
          file build/linux/arm64-v8a/release/libbili_plugin.so
          readelf -h build/linux/arm64-v8a/release/libbili_plugin.so | grep -E 'Machine|Class'
          echo "=== GLIBC 版本需求 (必须 ≤2.27，设备 glibc 版本) ==="
          readelf -V build/linux/arm64-v8a/release/libbili_plugin.so | grep -oE 'GLIBC_[0-9.]+' | sort -u
          echo "=== init_plugin 必须导出 ==="
          readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | grep init_plugin
          echo "aarch64 构建完成"

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash package.sh
          echo "=== 打包内容验证 ==="
          unzip -l bili_plugin.zip
          unzip -p bili_plugin.zip bili_plugin/libbili_plugin.so > /tmp/check_arch.so
          file /tmp/check_arch.so
          echo "=== 确认打包的是 aarch64 版本 ==="
          readelf -h /tmp/check_arch.so | grep -E 'Machine'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30