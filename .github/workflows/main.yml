name: Build BiliPocket Plugin

on:
  push:
    branches: [ main, fix/* ]
  pull_request:
    branches: [ main ]

# 失败时把 aarch64 构建日志推到 ci-log 分支，便于直接 raw 读取（无需登录）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils clang pkg-config wget zip file \
            qtbase5-dev qtbase5-dev-tools qtdeclarative5-dev qml-module-qtquick2 \
            qtquickcontrols2-5-dev libqt5quickwidgets5 \
            libqt5multimedia5 libqt5multimedia5-plugins \
            libqt5multimediawidgets5 qtmultimedia5-dev

          # Qt Quick 场景图头（qsgnode.h → QtGui/qopengl.h）会 include <GL/gl.h>，
          # 缺了它 aarch64 交叉编译会以 "fatal error: 'GL/gl.h' file not found" 失败。
          # 包名在 Ubuntu 22.04/24.04 上不同，两个都兜一下。
          sudo apt-get install -y --no-install-recommends libgl-dev \
            || sudo apt-get install -y --no-install-recommends libgl1-mesa-dev mesa-common-dev
          ls -la /usr/include/GL/gl.h

          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz

      - name: Install Zig
        run: |
          ZIG_VERSION=0.13.0
          wget -q https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz
          tar -xf zig-linux-x86_64-${ZIG_VERSION}.tar.xz
          sudo mv zig-linux-x86_64-${ZIG_VERSION} /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash -s --
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix Qt linking
        run: |
          set -e
          TARGET_DIR=/usr/lib/x86_64-linux-gnu
          CAND=$(find "$TARGET_DIR" /usr/lib -type f -name 'libQt5Multimedia.so.*' | head -n 1 || true)
          if [ -n "$CAND" ]; then
            sudo ln -sf "$CAND" "$TARGET_DIR/libQt5Multimedia.so"
            sudo ldconfig
            echo "Created symlink libQt5Multimedia.so"
          fi

      - name: Build Plugin x86_64 (验证编译)
        env:
          CC: clang
          CXX: clang++
          LD: ld.lld
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "=== x86_64 构建 ==="
          xmake f -c -m release -p linux -a x86_64 -vD
          xmake -vD
          echo "x86_64 构建完成"
          file build/linux/x86_64/release/libbili_plugin.so

      - name: Build Plugin aarch64 (交叉编译, Zig + glibc 2.27)
        run: |
          set -x
          exec > /tmp/aarch64_step.log 2>&1
          echo "=== aarch64 交叉编译 (Zig, glibc 2.27) ==="

          QT_INC=/usr/include/x86_64-linux-gnu/qt5
          echo "Qt include path: $QT_INC"
          which zig && zig version
          echo "zig PATH check done"

          mkdir -p build/linux/arm64-v8a/release

          # Qt Quick 场景图头（qsggeometry.h → QtGui/qopengl.h）会 include <GL/gl.h>。
          # 注意：zig -target aarch64 使用的是自带的 aarch64 sysroot，**不会**搜索宿主
          # 的 /usr/include，所以光 apt 装 libgl-dev 没用，必须把 GL 头单独放到一个
          # 目录里再用 -I 指给 zig（只放 GL/KHR，避免把宿主 libc 头也带进来）。
          echo "=== 准备 GL 头 shim ==="
          ls -la /usr/include/GL/gl.h || true
          mkdir -p /tmp/glshim/GL /tmp/glshim/KHR
          cp -f /usr/include/GL/*.h /tmp/glshim/GL/ 2>/dev/null || true
          cp -f /usr/include/KHR/*.h /tmp/glshim/KHR/ 2>/dev/null || true
          ls /tmp/glshim/GL /tmp/glshim/KHR || true
          [ -f /tmp/glshim/GL/gl.h ] || { echo "FATAL: /tmp/glshim/GL/gl.h 缺失（libgl-dev 没装？）"; exit 1; }

          find src -name '*.cpp' > /tmp/srcs.txt

          # 关键：先运行 Qt moc 生成 moc_*.cpp（提供 staticMetaObject / qt_metacall / vtable 依赖），
          # 否则 Q_OBJECT 类的 vtable 无 key function 定义，dlopen 报 undefined symbol: _ZTV14BiliController
          echo "=== 定位 moc ==="
          export PATH="/usr/lib/qt5/bin:/usr/lib/x86_64-linux-gnu/qt5/bin:$PATH"
          MOC=""
          for cand in /usr/lib/qt5/bin/moc /usr/lib/x86_64-linux-gnu/qt5/bin/moc $(command -v moc 2>/dev/null) /usr/bin/moc; do
            if [ -x "$cand" ] && [ -n "$cand" ]; then MOC="$cand"; break; fi
          done
          echo "moc = $MOC"
          ls -la /usr/lib/qt5/bin/ 2>/dev/null | head -5 || true
          if [ -z "$MOC" ]; then echo "FATAL: moc not found"; exit 1; fi
          mkdir -p /tmp/moc_build
          MOC_CPPS=""
          for hdr in $(grep -rlE 'Q_OBJECT' src --include='*.h'); do
            base=$(basename "$hdr" .h)
            outp="/tmp/moc_build/moc_${base}.cpp"
            # 提取类名推导 moc 输出名是 moc_<filename>，直接用头文件
            "$MOC" -I src -I "$QT_INC" -I "$QT_INC/QtCore" -I "$QT_INC/QtQuick" -I "$QT_INC/QtQml" -I "$QT_INC/QtNetwork" -I "$QT_INC/QtMultimedia" -I "$QT_INC/QtGui" "$hdr" -o "$outp" 2>/tmp/moc_err.log || { echo "  moc FAILED: $hdr"; cat /tmp/moc_err.log; exit 1; }
            echo "  moc -> $outp"
            MOC_CPPS="$MOC_CPPS $outp"
          done
          echo "=== moc 生成文件列表 ==="
          find /tmp/moc_build -name '*.cpp' | sort
          echo "=== moc 版本 ==="
          "$MOC" --version

          # 关键：不 -DQT_NO_KEYWORDS（代码依赖 signals/slots/emit），
          # 不链接 Qt（宿主 DictPen 进程已加载 Qt，符号运行时解析），
          # 用 Zig 指定 glibc 2.27（设备 glibc=2.27，Ubuntu 工具链会引入 GLIBC_2.32 符号导致 dlopen 失败）
          # --no-gc-sections：插件无显式 new BiliController（QML 引擎运行时创建），
          #   防止链接器裁剪 vtable/静态 init 段
          echo "=== 开始 zig 编译 ==="
          zig c++ -target aarch64-linux-gnu.2.27 \
            -std=c++17 -shared -fPIC -O2 -s \
            -Wl,--no-gc-sections \
            -I src \
            -I /tmp/glshim \
            -I "$QT_INC" \
            -I "$QT_INC/QtCore" \
            -I "$QT_INC/QtQuick" \
            -I "$QT_INC/QtQml" \
            -I "$QT_INC/QtNetwork" \
            -I "$QT_INC/QtMultimedia" \
            -I "$QT_INC/QtGui" \
            $(cat /tmp/srcs.txt) \
            $(find /tmp/moc_build -name '*.cpp') \
            -o build/linux/arm64-v8a/release/libbili_plugin.so || { echo "=== ZIG BUILD FAILED ==="; exit 1; }

          echo "=== ZIG 构建成功 ==="
          file build/linux/arm64-v8a/release/libbili_plugin.so
          readelf -h build/linux/arm64-v8a/release/libbili_plugin.so | grep -E 'Machine|Class'
          echo "=== GLIBC 版本需求 (必须 ≤2.27，设备 glibc 版本) ==="
          readelf -V build/linux/arm64-v8a/release/libbili_plugin.so | grep -oE 'GLIBC_[0-9.]+' | sort -u
          echo "=== init_plugin 必须导出 ==="
          readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | grep init_plugin || { echo "FATAL: init_plugin 未导出"; exit 1; }
          echo "=== vtable 必须已定义 (GLOBAL DEFAULT, 非 UND) ==="
          readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | grep _ZTV14BiliController || { echo "FATAL: BiliController vtable 未定义"; exit 1; }
          echo "=== 所有 Q_OBJECT vtable 必须已定义 (UND 的 _ZTV 应为 0) ==="
          VT_UND=$(readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | awk '$7=="UND"{print $8}' | grep -cE '^_ZTV' || true)
          echo "UND vtable 数量: $VT_UND"
          [ "$VT_UND" = "0" ] || { echo "FATAL: 存在未定义的 vtable，moc 未覆盖全部 Q_OBJECT"; exit 1; }
          echo "=== staticMetaObject 定义位置 (moc 生成，内部引用; 未导出属正常) ==="
          if readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | grep -qE '_ZN14BiliController16staticMetaObjectE'; then
            echo "staticMetaObject: 已导出"
          else
            echo "staticMetaObject: 未在 .dynsym 导出（内部引用，正常）"
          fi
          echo "=== 所有 UND 符号 (应只允许 libQt/libc/glibc 家族) ==="
          readelf --dyn-syms build/linux/arm64-v8a/release/libbili_plugin.so | awk '$7=="UND"{print $8}' | sort -u | grep -vE '^(_ZT[ISV]|_ZN[0-9]+QObject|_ZN[0-9]+Q[A-Z]|_ZNK[0-9]+Q[A-Z]|__cxa|_Unwind|_ITM|__gmon|GLIBC|libc_|pthread|dl_|memcpy|memset|memmove|strlen|strcmp|qIsNull|qIsFinite|qt|NativeQt|_PRETTY_FUNCTION_|__dso_handle|_edata|__bss_start|_end|std::)' || echo "OK: 无非 Qt/libc UND 符号"
          echo "aarch64 构建完成"

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash package.sh
          echo "=== 打包内容验证 ==="
          unzip -l bili_plugin.zip
          unzip -p bili_plugin.zip bili_plugin/libbili_plugin.so > /tmp/check_arch.so
          file /tmp/check_arch.so
          echo "=== 确认打包的是 aarch64 版本 ==="
          readelf -h /tmp/check_arch.so | grep -E 'Machine'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Upload build diagnostics (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics
          path: |
            /tmp/aarch64_step.log
            /tmp/moc_build/
            /tmp/srcs.txt
            /tmp/moc_err.log
          retention-days: 7

      - name: Publish aarch64 failure log to ci-log branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cilog
          {
            echo "sha: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID}"
            echo "=== /tmp/aarch64_step.log ==="
            cat /tmp/aarch64_step.log 2>/dev/null || echo "(no /tmp/aarch64_step.log)"
            echo
            echo "=== /tmp/moc_err.log ==="
            cat /tmp/moc_err.log 2>/dev/null || echo "(no moc_err.log)"
            echo
            echo "=== /tmp/moc_build ==="
            ls -la /tmp/moc_build 2>/dev/null || true
          } > /tmp/cilog/aarch64.log 2>&1

          # 同时打到 job 日志，方便直接在网页上看
          tail -n 120 /tmp/cilog/aarch64.log || true

          cd /tmp/cilog
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b ci-log
          git add -A
          git commit -qm "ci: aarch64 构建失败日志 ${GITHUB_SHA}" || true
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log
