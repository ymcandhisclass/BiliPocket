name: Build BiliPocket Plugin

on:
  push:
    branches: [ "YDP03X", "main" ]
  pull_request:
    branches: [ "YDP03X", "main" ]
  workflow_dispatch:

env:
  TARGET_ARCH: arm64-v8a
  TARGET_TRIPLE: aarch64-linux-gnu
  GOOS: linux
  GOARCH: arm64
  CGO_ENABLED: 0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file unzip wget cmake ninja-build pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 如果 go.sum 不存在，自动生成
      - name: Ensure go.sum exists
        run: |
          cd go_server
          go mod tidy || true

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 'v3.0.9'

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.11.0'

      - name: Install aarch64 Qt (with retry)
        run: |
          QT_URL="https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/download/5.15.2/aarch64-linux-qt-5.15.2.tar.gz"
          QT_DIR="$HOME/qt-5.15.2-aarch64-linux-gnu"
          mkdir -p "$QT_DIR"
          echo "Downloading Qt from $QT_URL"
          curl -L --retry 5 --retry-delay 5 --fail -o qt.tar.gz "$QT_URL"
          tar -xzf qt.tar.gz -C "$QT_DIR" --strip-components=1
          echo "QT_DIR=$QT_DIR" >> $GITHUB_ENV
          echo "Qt installed at $QT_DIR"

      - name: Build libbili_plugin.so
        run: |
          xmake f -c \
            --qt="$QT_DIR" \
            --arch=${{ env.TARGET_ARCH }} \
            --toolchain=zigcc \
            --cross=${{ env.TARGET_TRIPLE }}.2.27 \
            -m release \
            -vD
          xmake

      - name: Build Go server
        run: |
          cd go_server/main
          go build -ldflags="-s -w" -trimpath -o ../server
          cd ../sms
          go build -ldflags="-s -w" -trimpath -o ../bili-sms

      - name: Package plugin
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30
