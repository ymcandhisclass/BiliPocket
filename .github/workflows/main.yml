name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          sudo apt-get update -y

          # 安装系统依赖与 Qt 开发包（本机构建）
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            pkg-config \
            wget \
            zip \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev \
            libqt5quickwidgets5 \
            libqt5multimedia5-plugins \
            libqt5multimedia5 \
            libqt5multimediawidgets5

          # 安装 Go
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Install Zig (optional for zigcc)
        run: |
          if command -v zig >/dev/null 2>&1; then
            echo "zig present: $(zig version)"
          else
            # 安装 zig（可选，若不使用 zigcc 可省略）
            sudo apt-get install -y zig || true
          fi

      - name: Install xmake
        run: |
          if command -v xmake >/dev/null 2>&1; then
            echo "xmake already installed: $(xmake --version)"
            echo "$(dirname $(command -v xmake))" >> $GITHUB_PATH
          else
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://xmake.io/shget.text | bash -s --
            else
              wget -qO- https://xmake.io/shget.text | bash -s --
            fi
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi

      - name: Build Plugin with xmake (native)
        env:
          PATH: ${{ env.PATH }}:/usr/local/go/bin:$HOME/.local/bin
        run: |
          echo "zig: $(command -v zig || true)"
          echo "xmake: $(command -v xmake || true)"
          xmake --version || true

          # 使用系统 Qt，移除交叉参数（构建 x86_64 本机产物）
          xmake f -c -m release -vD
          xmake -vD

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30
