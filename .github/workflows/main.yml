name: Build BiliPocket Plugin

on:
  push:
    branches: [ YDP03X ]
  pull_request:
    branches: [ YDP03X ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: YDP03X

      - name: Set up build environment
        run: |
          # 更新包管理器
          sudo apt-get update
          
          # 安装必要的依赖
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            wget \
            zip
          
          # 安装 Go 1.20+
          wget -q https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          export PATH=$PATH:/usr/local/go/bin
          go version

      - name: Install xmake
        run: |
          # 安装 xmake v3.0.9
          wget https://github.com/xmake-io/xmake/releases/download/v3.0.9/xmake-v3.0.9.ubuntu.x86_64.AppImage
          chmod +x xmake-v3.0.9.ubuntu.x86_64.AppImage
          sudo mv xmake-v3.0.9.ubuntu.x86_64.AppImage /usr/local/bin/xmake
          xmake --version

      - name: Setup Qt cross-compilation
        run: |
          # 下载 aarch64 Qt 交叉编译工具链
          # 这里需要根据项目实际情况配置 Qt 路径
          # 假设从项目仓库或外部存储获取
          mkdir -p $HOME/qt-aarch64
          # 从 GitHub Releases 或自定义源下载
          wget -q https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/download/v5.15.2/qt-aarch64-linux-5.15.2.tar.gz -O qt.tar.gz || echo "Qt 下载失败，使用本地配置"
          # tar -xzf qt.tar.gz -C $HOME/qt-aarch64 || echo "Qt 解压失败"

      - name: Build Plugin with xmake
        run: |
          export PATH=$PATH:/usr/local/go/bin
          
          # 配置并编译 C++/Qt 插件
          # 根据实际环境调整 Qt 路径
          xmake f -c \
            --qt="$HOME/qt-aarch64/Qt-5.15.2-aarch64" \
            --arch=arm64-v8a \
            --toolchain=zigcc \
            --cross=aarch64-linux-gnu.2.27 \
            -m release -vD || true
          
          # 如果上述配置失败，尝试默认配置
          xmake || echo "xmake 编译失败，尝试替代方案"

      - name: Build Go services
        run: |
          export PATH=$PATH:/usr/local/go/bin
          cd go_server
          bash build.sh

      - name: Package plugin
        run: |
          bash package.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: bili_plugin
          path: bili_plugin.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: BiliPocket ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bili_plugin.zip
          asset_name: bili_plugin.zip
          asset_content_type: application/zip
